name: Deploy Codespace Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'codespace-*'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run check

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to preview
        run: |
          echo "🚀 Deployment would happen here"
          echo "Preview URL: https://${{ github.event.repository.name }}-${{ github.sha }}.preview.app"